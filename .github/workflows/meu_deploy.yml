name: Build e Deploy Chatwoot

on:
  push:
    branches: [ "dynamus-custom" ] # Ou a sua branch de desenvolvimento

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: pedrobarros123
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Você cria essa chave no painel do GitHub

      - name: Configurar BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Compilar e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: pedrobarros123/chatwoot:v3.0
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max